name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relay-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test frontend logic
        run: npm test

      - name: Build dashboard
        run: npm run build

  dotnet-unit:
    name: .NET build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore Relay.slnx --locked-mode

      - name: Build solution
        run: >-
          dotnet build Relay.slnx
          --configuration Release
          --no-restore
          --disable-build-servers
          --no-incremental
          -m:1
          --verbosity minimal

      - name: Run unit tests
        run: >-
          dotnet test tests/Relay.UnitTests/Relay.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --disable-build-servers
          --logger "trx;LogFileName=unit.trx"
          --results-directory TestResults/unit
          --verbosity minimal

      - name: Upload failed unit-test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-unit-${{ github.run_attempt }}
          path: TestResults/unit/
          if-no-files-found: ignore
          retention-days: 7

  dotnet-integration:
    name: .NET integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: >-
          dotnet restore tests/Relay.IntegrationTests/Relay.IntegrationTests.csproj
          --locked-mode

      - name: Run PostgreSQL integration tests
        run: >-
          dotnet test tests/Relay.IntegrationTests/Relay.IntegrationTests.csproj
          --configuration Release
          --no-restore
          --disable-build-servers
          --logger "trx;LogFileName=integration.trx"
          --results-directory TestResults/integration
          --verbosity minimal

      - name: Upload failed integration-test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-integration-${{ github.run_attempt }}
          path: TestResults/integration/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Docker Compose and Playwright
    needs: [frontend, dotnet-unit, dotnet-integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start Relay
        run: docker compose up --build --detach --remove-orphans

      - name: Verify migration and health
        run: |
          curl --fail --silent --show-error \
            --retry 60 \
            --retry-all-errors \
            --retry-delay 2 \
            http://127.0.0.1:3000/healthz
          test "$(docker compose ps --all --format '{{.ExitCode}}' migrate)" = "0"

      - name: Run Playwright workflow
        env:
          RELAY_BASE_URL: http://127.0.0.1:3000
        run: npm run test:e2e

      - name: Capture failure diagnostics
        if: failure()
        run: |
          docker compose ps --all > compose-ps.txt || true
          docker compose logs --no-color --timestamps > compose-logs.txt || true

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-e2e-${{ github.run_attempt }}
          path: |
            compose-ps.txt
            compose-logs.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Relay
        if: always()
        run: docker compose down --volumes --remove-orphans
